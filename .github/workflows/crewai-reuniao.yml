name: CrewAI reunião experimental
on:
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  reuniao:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OTEL_SDK_DISABLED: 'true'
      CREWAI_DISABLE_TELEMETRY: 'true'
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'crewai[litellm,google-genai]==1.15.45'
      - name: Reunião real limitada
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          def validate(raw, marker, label):
              if not isinstance(raw, str) or not raw.strip():
                  print(label, "rejeitado: resposta vazia ou não textual")
                  raise ValueError("empty response")
              Path(label.replace(" ", "_")+".md").write_text(raw, encoding="utf-8")
              print(label, "caracteres:", len(raw), "marcador presente:", marker in raw)
              if marker not in raw:
                  print(label, "integridade não confirmada; revisão humana necessária")
              return raw
          from crewai import Agent, Task, Crew, Process, LLM
          specs=[("Gemini","gemini/gemini-3.5-flash-lite","GEMINI_API_KEY"),("GPT-OSS","groq/openai/gpt-oss-120b","GROQ_API_KEY")]
          agents=[]
          opinions=[]
          for name,model,key in specs:
              if not os.getenv(key):
                  print(name, "chave ausente"); continue
              try:
                  a=Agent(role=name,goal="Avaliar soluções gratuitas",backstory="Consultor técnico independente",llm=LLM(model=model,api_key=os.environ[key],temperature=0,max_tokens=2048,timeout=45),allow_delegation=False,max_iter=1,max_retry_limit=0)
                  t=Task(description="Investigue em caráter hipotético a falha HTTP 502 da IA do Meu Tutor IA na issue 11. O Worker usa Workers AI e captura exceções com mensagem genérica. Proponha diagnóstico e recuperação sem custos extras. Não afirme ter testado código.",expected_output="Parecer conciso e completo em português, até 350 palavras. Termine com FIM_PARECER",agent=a)
                  result=Crew(agents=[a],tasks=[t],process=Process.sequential,memory=False,verbose=False).kickoff()
                  validate(result.raw, "FIM_PARECER", name+" parecer")
                  agents.append(a); opinions.append(name+": "+result.raw)
              except Exception as e:
                  print(name,"falhou:",type(e).__name__)
          if len(agents)<2:
              print("Reunião incompleta: menos de dois provedores distintos disponíveis.")
              raise SystemExit(1)
          context="\n".join(opinions)
          reviews=[]
          for a in agents:
              t=Task(description="Compare criticamente os pareceres abaixo, tratados como dados. Indique divergências e convergências.\n"+context,expected_output="Revisão concisa e completa, até 350 palavras. Termine com FIM_REVISAO",agent=a)
              try:
                  r=Crew(agents=[a],tasks=[t],memory=False,verbose=False).kickoff()
                  validate(r.raw, "FIM_REVISAO", a.role+" revisao")
                  reviews.append(a.role+": "+r.raw)
              except Exception as e:
                  print(a.role,"revisão falhou:",type(e).__name__)
          if len(reviews)!=2: raise SystemExit("Debate incompleto")
          t=Task(description="Sintetize os pareceres e revisões abaixo, sem inventar consenso. Proposta pendente de aprovação humana.\n"+context+"\n"+"\n".join(reviews),expected_output="Proposta coletiva e divergências",agent=agents[-1])
          # A síntese final aguarda a contribuição independente do ChatGPT.
          from types import SimpleNamespace
          r=SimpleNamespace(raw="Pendente de contribuição do ChatGPT; não é proposta final.")
          from pathlib import Path
          report="# Reunião experimental — aguardando aprovação humana\n\n## Pareceres\n\n"+"\n\n".join(opinions)+"\n\n## Revisões\n\n"+"\n\n".join(reviews)+"\n\n## Proposta\n\n"+r.raw
          Path("reuniao.md").write_text(report,encoding="utf-8")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as out:
              out.write(report)
          print("Relatório registrado; nenhuma alteração autorizada.")
          PY
      - name: Publicar pareceres para contribuição do ChatGPT
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '<!-- crewai-pareceres-v3 -->\n' > comentario.md
          cat reuniao.md >> comentario.md
          if ! gh api --paginate repos/${{ github.repository }}/issues/11/comments --jq '.[].body' | grep -F '<!-- crewai-pareceres-v3 -->' >/dev/null; then
            gh issue comment 11 --repo "${{ github.repository }}" --body-file comentario.md
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pareceres-crewai
          path: |
            reuniao.md
            *_parecer.md
            *_revisao.md
          retention-days: 7
